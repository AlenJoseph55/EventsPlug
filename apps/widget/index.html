<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EventsPlug Embeddable Widget Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        padding: 40px 20px;
        background-color: #0b1120;
        font-family: 'Plus Jakarta Sans', sans-serif;
        color: #f3f4f6;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      header {
        text-align: center;
        margin-bottom: 50px;
      }
      header h1 {
        font-size: 2.5rem;
        font-weight: 800;
        background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 10px;
        letter-spacing: -0.025em;
      }
      header p {
        color: #9ca3af;
        font-size: 1.1rem;
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>EventsPlug Live Embed Demo</h1>
        <p>Demonstrating our custom Web Component: <code>&lt;event-widget org="hash2025"&gt;&lt;/event-widget&gt;</code></p>
      </header>
      
      <!-- Embed our custom Multi-Tenant Event Web Component -->
      <event-widget org="hash2025"></event-widget>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
