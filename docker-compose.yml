version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: eventsplug-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: eventsplug
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventsplug"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
